name: Build Kegel Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
          uses: android-actions/setup-android@v3
          with:
            packages: platform-tools platforms;android-35 build-tools;35.0.0

      
      - name: Extract project
        run: |
          unzip -q KegelPro_Xiaomi_CloudBuild.zip -d source

      - name: Build APK
        run: |
          cd source/KegelProXiaomi
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KegelPro-debug-apk
          path: source/KegelProXiaomi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
